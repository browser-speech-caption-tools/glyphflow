<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>karaoke-narrator demo</title>
  </head>
  <body>
    <main>
      <h1>karaoke-narrator</h1>
      <label
        >Text
        <textarea id="text">
This is a karaoke caption, rendered from left to right.</textarea></label
      ><label
        >Voice
        <select id="voice">
          <option>Loading voices…</option>
        </select></label
      ><label
        >Rate <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1.6" />
        <output id="rate-value">1.6</output></label
      >
      <p>
        <button id="speak">Speak</button><button id="pause">Pause</button
        ><button id="resume">Resume</button><button id="cancel">Cancel</button
        ><button id="download">Download diagnostics</button>
      </p>
      <p id="status" role="status" aria-live="polite">Idle</p>
      <div id="caption"></div>
      <h2>Word timings</h2>
      <table>
        <thead>
          <tr>
            <th>Word</th>
            <th>Predicted</th>
            <th>Actual</th>
            <th>Error</th>
          </tr>
        </thead>
        <tbody id="timings"></tbody>
      </table>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
